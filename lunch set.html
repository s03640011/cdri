update(){const p=people.find(p=>String(p.id)===select.value);$('empty').hidden=!!p;$('result').classList.toggle('show',!!p);$('tablePill').hidden=!p;if(p){$('personName').textContent=p.name;$('tablePill').textContent='📍 '+p.table+' 桌';['salad','main','drink'].forEach(k=>$(k).textContent=p[k]||'未填寫');$('note').textContent=p.note&&p.note!=='無'?'特殊飲食需求／過敏提醒：'+p.note:'特殊飲食需求／過敏提醒：無特別註記';$('note').classList.toggle('none',!p.note||p.note==='無')}draw()}select.addEventListener('change',update);update();
